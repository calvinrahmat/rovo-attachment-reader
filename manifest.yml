modules:
  rovo:agent:
    - key: attachment-reader-agent
      name: Attachment Reader
      description: Reads and analyzes document attachments on Jira issues.
      prompt: >
        You help users understand the contents of files attached to Jira issues.
        When asked about an attachment, or to summarize/analyze the files on an
        issue, call the "Get Jira issue attachment content" action with the
        issue key (and attachment ID if the user names a specific file). Use the
        extracted text it returns to answer the user's question. If an
        attachment type is unsupported or too large, tell the user which file
        could not be read and why.
      conversationStarters:
        - Summarize the attachments on this issue
        - What does the attached document say?
      actions:
        - get-issue-attachment-content

  rovo:mcp:
    - key: attachment-reader-mcp
      name: Attachment Reader
      tools:
        - get-issue-attachment-content

  action:
    - key: get-issue-attachment-content
      function: main
      name: Get Jira issue attachment content
      actionVerb: GET
      description: >
        Fetches a Jira issue's attachments and extracts text content from
        supported document types (PDF, DOCX, TXT, CSV, JSON, Markdown) so it can
        be analyzed. Unsupported or oversized files are reported but not read.
      inputs:
        issueIdOrKey:
          title: Issue ID or key
          type: string
          required: true
          description: The Jira issue key (e.g. PROJ-123) or numeric issue ID.
        attachmentId:
          title: Attachment ID
          type: string
          required: false
          description: >
            Optional. If provided, only this attachment is read. Otherwise every
            supported attachment on the issue is read.

  function:
    - key: main
      handler: index.handler

permissions:
  scopes:
    - read:jira-work

app:
  id: ari:cloud:ecosystem::app/1b9277c8-eab6-4cc7-9c9e-dc32d51377ce
  runtime:
    name: nodejs22.x
